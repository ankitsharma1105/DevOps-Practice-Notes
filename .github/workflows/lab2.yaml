name: Java Lab Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java code
        run: |
          cd myapp
          javac *.java

      - name: Run Java program
        run: |
          cd myapp
          java Main